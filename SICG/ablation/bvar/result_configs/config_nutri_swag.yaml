# Between-imputation-variance study (nutri). Base = nutri deployed SICG
# (best_config_sicg.yaml). mi_approx = SWAG, which SICG trains with the SGD
# optimiser block (sicg.py::_init_optimizers) and samples generator weights from
# the SWAG posterior at impute time. SGD lr / epochs mirror the surv ablation
# config_swag.yaml (re-tuned there): lr_g/lr_d = 3.0e-3, epochs = 20000 (SWAG
# needs the long post-swag_start collection window). m lowered to 5 (surv-ablation
# value) to keep the 20-rep nutri run light.
processing:
  normalization: 'zscore'
  log: true
  gmm:
    max_components: 1
    epsilon: 1.0e-06

model:
  residual_modeling: false
  semi_supervised: false
  generator:
    noise_dim: 64
    hidden_dim: 512
    layers: 2
    dropout: 0.5

  discriminator:
    hidden_dim: 512
    layers: 2
    pack: 1

sample:
  m: 5
  mi_approx: "SWAG"
  pmm: false
  donors: 5

train:
  epochs: 20000         # tuned (surv swag_epochs); SWAG needs the long collection window
  batch_size: 400
  Adam:
    lr_g: 0.0004
    lr_d: 0.0004
    betas_g: [0.5, 0.9]
    betas_d: [0.5, 0.9]
    weight_decay: 1.0e-06
  SGD:
    lr_g: 3.0e-3         # tuned (surv swag); >=1e-2 diverged, <=1.4e-3 underfit
    momentum_g: 0.9
    lr_d: 3.0e-3
    momentum_d: 0.9
    weight_decay: 1.0e-4
  loss:
    lambda_gp: 10
    loss_mse: 0
    loss_ce: 0
    loss_mml: 0
    loss_info: 0
    tau: 0.2
    hard_gumbel: false
    discriminator_steps: 3
