## Base config for the GAIN epoch-tuning profile. Replace the non-epoch fields with the
## winners from `tuning_gain.py --profile gain` before running the epoch search.
model:
  hint_rate: 0.9
train:
  epochs: 10000
  batch_size: 128
  loss:
    alpha: 100
    beta: 10
  Adam:
    lr: 0.001
    betas_g: [0.9, 0.999]
    betas_d: [0.9, 0.999]
    weight_decay: 0.0001
